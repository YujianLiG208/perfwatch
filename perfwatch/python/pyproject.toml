[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perfwatch"
version = "0.1.0"
description = "Local Windows performance and energy monitor."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]
packaging = [
    "pyinstaller==6.22.2",
    "pybind11",
]

[project.scripts]
perfwatch = "perfwatch.runtime:main"
perfwatch-overlay = "perfwatch.overlay.__main__:main"
perfwatch-server = "perfwatch.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"perfwatch.storage" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
