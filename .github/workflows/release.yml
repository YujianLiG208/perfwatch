name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: build-windows
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
        working-directory: perfwatch
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: perfwatch/python/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: perfwatch/ui/dashboard/package-lock.json

      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (& python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('python/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "project version is not semantic: $version"
          }
          if ($env:EVENT_NAME -eq "push") {
            if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+$' -or $env:REF_NAME -ne "v$version") {
              throw "tag '$env:REF_NAME' does not match project version '$version'"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install packaging dependencies
        run: python -m pip install -e "python[packaging]"

      - name: Install frontend dependencies
        working-directory: perfwatch/ui/dashboard
        run: npm ci

      - name: Build Windows application
        run: |
          $vswherePath = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswherePath -PathType Leaf)) {
            throw "vswhere.exe not found"
          }
          $visualStudioPath = & $vswherePath -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($visualStudioPath)) {
            throw "Visual Studio installation not found"
          }
          $visualStudioPath = $visualStudioPath.Trim()
          $vsDevShellPath = Join-Path $visualStudioPath "Common7\Tools\Launch-VsDevShell.ps1"
          $ninjaPath = (Get-Command ninja -ErrorAction Stop).Source
          $pythonPath = (Get-Command python -ErrorAction Stop).Source
          $pybind11Directory = & python -m pybind11 --cmakedir
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($pybind11Directory)) {
            throw "pybind11 CMake directory not found"
          }
          $pybind11Directory = $pybind11Directory.Trim()
          foreach ($resolvedPath in @($visualStudioPath, $vsDevShellPath, $ninjaPath, $pythonPath, $pybind11Directory)) {
            if ([string]::IsNullOrWhiteSpace($resolvedPath)) {
              throw "required build path is empty"
            }
          }
          & .\scripts\build_windows_package.ps1 `
            -NinjaPath $ninjaPath `
            -VsDevShellPath $vsDevShellPath `
            -Pybind11Directory $pybind11Directory `
            -PythonPath $pythonPath

      - name: Smoke packaged application
        run: python .\scripts\smoke_windows_package.py --executable .\dist\perfwatch\perfwatch.exe

      - name: Create release archive
        run: .\scripts\create_windows_release.ps1 -InputDirectory .\dist\perfwatch -OutputDirectory .\release

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: perfwatch-windows-x64
          path: |
            perfwatch/release/perfwatch-${{ steps.version.outputs.version }}-windows-x64.zip
            perfwatch/release/perfwatch-${{ steps.version.outputs.version }}-windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build-windows
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PROJECT_VERSION: ${{ needs.build-windows.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: perfwatch-windows-x64
          path: perfwatch/release

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $archive = ".\perfwatch\release\perfwatch-$env:PROJECT_VERSION-windows-x64.zip"
          gh release create $env:GITHUB_REF_NAME `
            $archive `
            "$archive.sha256" `
            --title "PerfWatch $env:GITHUB_REF_NAME" `
            --generate-notes `
            --notes "Unsigned Windows x64 archive. Verify the accompanying SHA-256 file before running."
